[versions]
play-app-update = "2.1.0"
firebase-messaging = "26.0.1"
google-services = "4.5.0"
play-services-code-scanner = "16.1.0"
qrcode-kotlin = "4.5.0"
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
compose-material3 = "1.9.0"
agp = "9.5.0"
kotlinx-serialization = "1.12.0"
kotlinx-datetime = "0.8.0"
