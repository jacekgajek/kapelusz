name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        # The development web bundle skips wasm-opt: CI only needs to prove the app compiles and links. The (unsigned)
        # release APK runs R8, which deploy relies on.
        run: ./gradlew check :androidApp:assembleDebug :androidApp:assembleRelease :composeApp:wasmJsBrowserDevelopmentExecutableDistribution :server:shadowJar
