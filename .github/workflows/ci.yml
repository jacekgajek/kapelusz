name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test and build
        # The same optimised builds deploy ships (ITERATION_3 R11): the production web bundle (with wasm-opt) and the
        # (unsigned) release APK with R8, so their failures show before a merge.
        run: ./gradlew check :androidApp:assembleDebug :androidApp:assembleRelease :composeApp:wasmJsBrowserDistribution :server:shadowJar
