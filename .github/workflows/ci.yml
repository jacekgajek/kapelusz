name: CI

# Pull requests: the tests. Pushes to main: the tests, then the deploy, which builds the signed release artefacts once
# (scripts/deploy.sh builds everything before uploading anything) and ships them.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels its older run. On main a running run always finishes, so a deploy is never cut
# short; of the runs waiting behind it only the newest is kept, which has every change anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # With headless Chrome for the web tests.
      - name: Test
        # compileKotlinMetadata: the shared source set as the IDE and `build` see it, which `check` alone does not compile.
        run: ./gradlew check compileKotlinMetadata

