name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Tests (with headless Chrome for the web ones) and the optimised builds in separate steps: all at once ran the
      # runner out of memory.
      - name: Test
        run: ./gradlew check

      - name: Build
        # The same optimised builds deploy ships (ITERATION_3 R11): the production web bundle (with wasm-opt) and the
        # (unsigned) release APK with R8, so their failures show before a merge.
        # R8 and the production wasm compile each need several GB: one after the other, with memory logged meanwhile.
        run: |
          (while sleep 15; do echo "memory: $(free -m | awk '/Mem:/ {print $3 " MB used, " $7 " MB available"}')"; done) &
          ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease :server:shadowJar
          ./gradlew :composeApp:wasmJsBrowserDistribution
