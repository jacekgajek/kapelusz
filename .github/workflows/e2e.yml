name: End-to-end

# The app's screens in a browser against the local server (LOCAL_DEVELOPMENT.md, "End-to-end tests"): nightly, on
# demand, and on a pull request labelled `e2e`. Not part of CI: a scenario takes minutes, and a failure here is read by
# a person, not by the merge button.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Headless Chrome is on the runner image. -Pe2e builds the app for the local server, starts it, and turns the
      # end-to-end specs on; the other browser tests run too.
      - name: End-to-end tests
        run: ./gradlew :composeApp:wasmJsBrowserTest -Pe2e

      - name: Test results and the local server's log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results
          path: |
            composeApp/build/test-results/wasmJsBrowserTest
            composeApp/build/reports/tests/wasmJsBrowserTest
            composeApp/build/e2e/local-server.log
          if-no-files-found: warn
