name: End-to-end

# The end-to-end tests: the app in a browser, talking to the local server (LOCAL_DEVELOPMENT.md, "End-to-end tests").
# Runs every night, when started by hand, and on pull requests with the `e2e` label. Not part of CI: it takes minutes,
# and a person reads the result, not the merge button.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  e2e:
    # Every label fires "labeled". Run only for the e2e label, and again on every push to a pull request that has it.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Concurrency on the job, not the workflow: a skipped job must not cancel a running one.
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Chrome is on the runner image. -Pe2e builds the app for the local server, starts the server and enables the
      # end-to-end specs. The other browser tests run too.
      - name: End-to-end tests
        run: ./gradlew :composeApp:wasmJsBrowserTest -Pe2e

      - name: Test results and the local server's log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results
          path: |
            composeApp/build/test-results/wasmJsBrowserTest
            composeApp/build/reports/tests/wasmJsBrowserTest
            composeApp/build/e2e/local-server.log
          if-no-files-found: warn
