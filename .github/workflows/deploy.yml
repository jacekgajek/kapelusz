name: Deploy

# Runs after CI succeeds on main and deploys exactly the commit CI tested.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write   # GitHub OIDC -> AWS role, no stored AWS keys
  contents: write   # GitHub Release with the APK

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTSPLIT_API_URL: ${{ vars.API_URL }}
      ARTSPLIT_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      WEB_BUCKET: ${{ vars.WEB_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # SHA-256 of the release signing certificate (from the keystore secret) plus an optional debug one, for
      # Android App Links (/.well-known/assetlinks.json).
      - name: Android certificate fingerprints
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          DEBUG_SHA256: ${{ vars.ANDROID_DEBUG_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          RELEASE=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/.*SHA256: *//p' | head -1)
          rm "$RUNNER_TEMP/release.jks"
          # Without a fingerprint the deploy would silently drop assetlinks.json and break Android App Links.
          if [[ -z "$RELEASE" ]]; then echo "::error::Could not read the release certificate fingerprint"; exit 1; fi
          echo "ANDROID_CERT_SHA256=${RELEASE}${DEBUG_SHA256:+,$DEBUG_SHA256}" >> "$GITHUB_ENV"

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Deploy API, web and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          # Android installs an update only with a higher version code; every deploy run has a higher number.
          ARTSPLIT_VERSION_CODE: ${{ github.run_number }}
        run: scripts/deploy.sh

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CODE: ${{ github.run_number }}
        run: |
          # A re-run of the same deploy keeps its run number, and with it the release.
          if gh release view "build-$CODE" >/dev/null 2>&1; then exit 0; fi
          FILE="$RUNNER_TEMP/art-split-$APK_VERSION_NAME-$CODE.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$FILE"
          gh release create "build-$CODE" "$FILE" --target "$SHA" --title "Art Split $APK_VERSION_NAME (build $CODE)" \
            --notes "Bandmates download it from https://artsplit.jacekgajek.com/download/art-split.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
