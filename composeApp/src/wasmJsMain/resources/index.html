<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Resolve the script, wasm and resources from the site root, also on deep links like /join/ABC123. -->
    <base href="/">
    <title>Pass the Hat</title>
    <script>
        // The name in the browser's language, like on Android: Kapelusz in Polish, Pass the Hat otherwise.
        if ((navigator.language || "").toLowerCase().startsWith("pl")) document.title = "Kapelusz";
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        /* The Compose canvas fills the window; the page itself never scrolls. */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
    <script>
        // In-app language override: Compose resources read navigator.languages.
        const languages = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
        Object.defineProperty(Navigator.prototype, "languages", Object.assign({}, languages, {
            get: function () {
                return window.__customLocale ? [window.__customLocale] : languages.get.apply(this);
            }
        }));
    </script>
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body></body>
</html>
